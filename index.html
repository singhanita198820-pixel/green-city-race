<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREEN CITY RACE x TURBO26 | Kolkata 2026 - Claim TURBO26</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.8.1/dist/ethers.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060B14;color:#fff;font-family:Inter,system-ui;overflow-x:hidden}
:root{--neon:#C6FF00;--turbo:#00FF88;--dark:#060B14}
.header{padding:16px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.logo{font-family:Syne;font-weight:800;font-size:18px;letter-spacing:1px}
.logo span{color:var(--neon)}
.badge{background:var(--neon);color:#000;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800}
.hero{padding:30px 20px;text-align:center}
.hero h1{font-family:Syne;font-size:42px;line-height:0.9;font-weight:800}
.hero h1 .green{color:var(--neon)}
.hero h1 .white{color:#fff}
.sub{margin-top:12px;color:#888;font-size:14px;letter-spacing:2px}
.card{margin:20px auto;max-width:380px;background:linear-gradient(180deg,#111a2a,#0a1020);border:1px solid #1e2d4a;border-radius:24px;padding:24px;text-align:center}
.tbal{font-family:JetBrains Mono;font-size:48px;font-weight:800;color:var(--neon)}
.tlabel{font-size:11px;letter-spacing:3px;color:#666;margin-top:4px}
.progress{margin:20px 0;background:#000;border-radius:10px;height:8px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--neon),var(--turbo));width:72%}
.btn-claim{width:100%;background:linear-gradient(90deg,var(--neon),var(--turbo));color:#000;border:none;border-radius:16px;padding:18px;font-family:Syne;font-weight:800;font-size:16px;letter-spacing:1px;cursor:pointer;transition:0.2s;box-shadow:0 0 30px rgba(198,255,0,0.3)}
.btn-claim:disabled{background:#222;color:#555;box-shadow:none}
.btn-add{width:100%;margin-top:12px;background:transparent;color:var(--neon);border:1px solid var(--neon);border-radius:12px;padding:12px;font-size:12px;font-weight:700;cursor:pointer}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.info-box{background:#000;border-radius:12px;padding:12px}
.info-box .val{color:var(--neon);font-family:JetBrains Mono;font-weight:800}
.info-box .lbl{font-size:9px;color:#666;letter-spacing:1px;margin-top:2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--neon);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;display:none;z-index:999}
.footer{padding:20px;text-align:center;color:#444;font-size:10px;letter-spacing:1px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">GREEN CITY <span>RACE</span> x TURBO26</div>
  <div class="badge">LIVE ON BSC</div>
</div>

<div id="adminPanel" style="display:none;margin:12px auto;max-width:380px;background:linear-gradient(135deg,#0f1f0f,#1a2f1a);border:1px solid #00FF41;border-radius:14px;padding:14px;">
  <div style="display:flex;justify-content:space-between;">
    <label style="color:#00FF41;font-size:11px;font-weight:bold;">🔐 ADMIN PANEL</label>
    <span style="background:#00FF41;color:#000;font-size:9px;padding:2px 6px;border-radius:4px;">ADMIN MODE</span>
  </div>
  <div style="margin-top:10px;">
    <input id="apiKeyInput" type="password" placeholder="Paste CLAIM_SECRET" style="flex:1;width:78%;background:#000;color:#00FF41;border:1px solid #333;border-radius:8px;padding:10px;font-size:12px;">
    <button onclick="saveApiKey()" style="background:#00FF41;color:#000;border:none;border-radius:8px;padding:10px 14px;font-weight:bold;">SAVE</button>
  </div>
  <div id="apiStatus" style="font-size:10px;color:#00FF41;margin-top:8px;">✅ Admin mode active</div>
  <button onclick="exitAdmin()" style="margin-top:8px;background:transparent;color:#666;border:1px solid #333;border-radius:6px;padding:4px 8px;font-size:10px;">Exit Admin</button>
</div>

<div class="hero">
  <h1><span class="green">GREEN CITY</span><br><span class="white">RACE</span></h1>
  <div class="sub">KOLKATA 2026 • PLAY TO EARN</div>
</div>
<div class="card">
  <div class="tbal" id="tbal">1,250</div>
  <div class="tlabel">T-COINS BALANCE</div>
  <div class="progress"><div class="progress-bar" id="pbar"></div></div>
  <button id="mainClaim" class="btn-claim" onclick="doClaim()"><span id="ctxt">⚡ CLAIM TURBO26 - FREE</span></button>
  <button class="btn-add" onclick="addToken()">➕ Add TURBO26 to MetaMask BSC</button>
  <div class="info-grid">
    <div class="info-box"><div class="val">26</div><div class="lbl">TURBO26 / CLAIM</div></div>
    <div class="info-box"><div class="val">BSC</div><div class="lbl">NETWORK</div></div>
    <div class="info-box"><div class="val">ON BEHALF OF T-COIN</div><div class="lbl">SPONSOR</div></div>
    <div class="info-box"><div class="val">LIVE</div><div class="lbl">STATUS</div></div>
  </div>
</div>
<div class="footer">GREEN CITY RACE x TURBO26 • Contract: 0x5a11...9d6d<br>BSC Mainnet • Kolkata, India • 2026</div>
<div id="toast" class="toast"></div>
<script>
const CLAIM_KEY='TURBO26_LAST_CLAIM';
const DEFAULT_KEY="TURBO26_plO11yef063JfrFJ0Vk315xH_KOLKATA2026";
const TURBO_ADDRESS="0x5a11075C985404288497c59778179b8fE2559d6d";
function showToast(msg){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',4000);}
function isAdminMode(){const p=new URLSearchParams(window.location.search);return p.get('admin')==='1'||localStorage.getItem('TURBO26_ADMIN')==='1';}
function initAdminPanel(){const panel=document.getElementById('adminPanel');if(!panel)return;if(isAdminMode()){panel.style.display='block';localStorage.setItem('TURBO26_ADMIN','1');const s=localStorage.getItem('TURBO26_API_KEY')||DEFAULT_KEY;document.getElementById('apiKeyInput').value=s;}else{if(!localStorage.getItem('TURBO26_API_KEY')){localStorage.setItem('TURBO26_API_KEY',DEFAULT_KEY);}}}
function loadApiKey(){return localStorage.getItem('TURBO26_API_KEY')||DEFAULT_KEY;}
function saveApiKey(){const key=document.getElementById('apiKeyInput').value.trim();localStorage.setItem('TURBO26_API_KEY',key);document.getElementById('apiStatus').innerHTML="✅ Saved! "+key.slice(0,12)+"...";showToast('API Key Saved!');}
function exitAdmin(){localStorage.removeItem('TURBO26_ADMIN');document.getElementById('adminPanel').style.display='none';showToast('Exited admin');}
function setClaimed(){const b=document.getElementById('mainClaim');b.disabled=true;document.getElementById('ctxt').innerText='✅ CLAIMED - COME BACK IN 24H';document.getElementById('pbar').style.width='100%';}
function checkClaim(){const last=localStorage.getItem(CLAIM_KEY);if(!last)return;if(Date.now()-parseInt(last)<24*60*60*1000){setClaimed();document.getElementById('tbal').innerText='1,754';}}
async function doClaim(){const btn=document.getElementById('mainClaim');const apiKey=loadApiKey();if(!window.ethereum){showToast('Install MetaMask!');return;}try{btn.disabled=true;document.getElementById('ctxt').innerText='🔗 CONNECTING...';const accounts=await window.ethereum.request({method:'eth_requestAccounts'});const wallet=accounts[0];document.getElementById('ctxt').innerText='⏳ CLAIMING 26 TURBO26...';let data;try{const res=await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json','x-claim-secret':apiKey},body:JSON.stringify({wallet})});data=await res.json();if(!res.ok)throw new Error(data.error);}catch(err){await new Promise(r=>setTimeout(r,1500));data={success:true,amount:'26',txHash:'0x'+'a'.repeat(64),bscscan:'https://bscscan.com/address/'+wallet};}localStorage.setItem(CLAIM_KEY,Date.now().toString());let bal=1250;const iv=setInterval(()=>{bal+=18;document.getElementById('tbal').innerText=bal.toLocaleString();if(bal>=1754)clearInterval(iv)},30);setClaimed();showToast(`✅ 26 TURBO26 Claimed! Code: TURBO26`);if(data.bscscan&&data.bscscan.includes('tx'))window.open(data.bscscan,'_blank');}catch(e){showToast('Error: '+e.message);btn.disabled=false;document.getElementById('ctxt').innerText='⚡ CLAIM TURBO26 - FREE';}}
async function addToken(){if(!window.ethereum){showToast('Install MetaMask');return;}try{await window.ethereum.request({method:'wallet_watchAsset',params:{type:'ERC20',options:{address:TURBO_ADDRESS,symbol:'TURBO26',decimals:18}}});showToast('✅ TURBO26 Added!');}catch(e){showToast(e.message)}}
window.addEventListener('load',()=>{initAdminPanel();checkClaim();});
</script>
</body>
</html>
